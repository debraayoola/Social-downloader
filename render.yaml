services:
  - type: web
    name: social-downloader
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: BASE_URL
        sync: false
      - key: FILE_TTL_SECONDS
        value: 21600
